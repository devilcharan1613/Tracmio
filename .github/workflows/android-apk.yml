name: Build Tracmio APK

on:
  push:
    branches: [main, master, tracmio-2.5.2-development]
  pull_request:
    branches: [main, master, tracmio-2.5.2-development]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses || true

      - name: Run tests, lint, debug APK & release compile check
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug compileReleaseKotlin

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Tracmio-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

